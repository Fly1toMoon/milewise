  # ---------------------------------------------------------------- abstain (3)
  - id: abstain-01
    category: abstain
    lang: ja
    question: "デルタ航空スカイマイルで東京→ロサンゼルスのビジネスは何マイル？"
    expected:
      reason: "対象外の航空会社。ANA/JALのチャートの数字を流用してはいけない"
    gold_urls: []
    source_note: "対象はANA/JALのみ"
    verified_at: null
    verified_by: null

  - id: abstain-02
    category: abstain
    lang: zh
    question: "明天东京飞伦敦的ANA商务舱还有奖励座位吗？"
    expected:
      reason: "空席は会員ログインが必要な空席照会でしか分からない。空席があるともないとも言ってはいけない"
      allow_figures: true   # quoting the (backed) required miles while declining availability is fine
    gold_urls: []
    source_note: "Milewise は空席を照会しない"
    revision_note: "2026-10-17: 必要マイルの提示は許可（根拠付きなら有益）。禁止は空席の有無の断定のみ"
    verified_at: null
    verified_by: null

  - id: abstain-03
    category: abstain
    lang: ja
    question: "ANA国内線で羽田から新千歳までの特典航空券は何マイル？"
    expected:
      reason: "国内線は第一版の対象外。国際線チャートの数字を答えてはいけない"
    gold_urls: []
    source_note: "国内線チャートは未収録（design.md R5）"
    verified_at: null
    verified_by: null
