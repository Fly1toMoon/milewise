# Milewise evaluation set (design.md §4, R9).
#
# Gold answers come from the airlines' official pages, NOT from Milewise's own tools,
# so a parser or tool bug shows up as a failed case instead of agreeing with itself.
# Each case starts with verified_at: null. A person checks it against the official page
# (source_note says where) and sets verified_at / verified_by. The runner reports how many
# cases are still unverified.
# crosschecked_at: the author of the cases (Claude) re-read every expected figure, season
# range and rubric point in the saved official pages (raw/…, 2026-10-17), independently of
# data/charts and of the tools. That is a second pass by the same author, not the human
# verification above, so verified_at stays null until a person signs it off.
#
# Categories and how they are graded:
#   miles    every expected figure must appear in the answer; no unbacked figure may appear
#   rules    LLM judge with a key-point rubric (must_mention / must_not_say)
#   both     both of the above
#   abstain  the answer must decline or say it is unsure, and give no mileage figure
# Citation accuracy: at least one cited source URL is in gold_urls.

defaults:
  ana_chart: &ana_chart https://www.ana.co.jp/ja/jp/guide/amc/award/international/terms/
  ana_refund: &ana_refund https://www.ana.co.jp/ja/jp/guide/amc/award/international/refund/
  ana_usage: &ana_usage https://www.ana.co.jp/ja/jp/guide/amc/award/international/usage/
  ana_application: &ana_application https://www.ana.co.jp/ja/jp/guide/amc/award/international/application/
  ana_partner: &ana_partner https://www.ana.co.jp/ja/jp/guide/amc/award/tk/usage/
  ana_partner_chart: &ana_partner_chart https://www.ana.co.jp/ja/jp/guide/amc/award/tk/zone/
  jal_ow_chart: &jal_ow_chart https://www.jal.co.jp/jp/ja/jalmile/use/partner_air/oneworld/miles.html
  jal_ow_refund: &jal_ow_refund https://www.jal.co.jp/jp/ja/jalmile/use/partner_air/oneworld/cancel.html
  jal_jmbp_chart: &jal_jmbp_chart https://www.jal.co.jp/jp/ja/jalmile/use/partner_air/p_jmb/jmb_mile.html
  ana_revision: &ana_revision https://www.ana.co.jp/ja/jp/guide/amc/award/tk/zone/info/250415/
  jal_chart: &jal_chart https://www.jal.co.jp/jp/ja/jalmile/use/jal/inter/routemiles.html
  jal_refund: &jal_refund https://www.jal.co.jp/jp/ja/jalmile/use/jal/inter/cancel.html
  jal_notes: &jal_notes https://www.jal.co.jp/jp/ja/jalmile/use/ticket.html

