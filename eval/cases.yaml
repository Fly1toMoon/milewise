    gold_urls: [*ana_chart]
    source_note: "往復チャート 日本（Zone 1）発着 欧州・ロシア2（Zone 7）、C: L 110,000 / R 115,000 / H 改定後 180,000"
    verified_at: null
    verified_by: null

