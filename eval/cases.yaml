  # ---------------------------------------------------------------- rules (7)
  - id: rules-01
    category: rules
    lang: ja
    question: "ANAの国際線特典航空券をキャンセルしたら手数料はいくら？マイルは戻る？"
    expected:
      reference: >-
        すべての区間が未使用で、予約便の出発前に手続きすればマイルは口座に戻る。2025年6月24日以降の
        予約・発券分は、クレジットカード決済の取消手数料か取消手数料マイルを選べる。2025年6月23日までの
        予約・発券分は取消手数料マイルのみで、1名につき3,000マイル。払い戻し時点で有効期限切れのマイルは戻らない。
      must_mention: ["全区間未使用であること（一部使用済みは不可）", "取消手数料マイル 1名3,000マイル（または予約時期で選択肢が異なる）"]
      must_not_say: ["一部使用済みでも払い戻せる", "手数料は無料"]
    gold_urls: [*ana_refund, *ana_revision]
    source_note: "変更・払い戻し > 未使用特典の払い戻し / ご注意、改定のお知らせ（3,000マイル）"
    verified_at: null
    crosschecked_at: 2026-10-18
    verified_by: null

  - id: rules-02
    category: rules
    lang: zh
    question: "ANA的国际线奖励机票出票后还能改日期吗？能换舱位或者改目的地吗？"
    expected:
      reference: >-
        可以变更搭乘日期和同一区间的航班（出票后需在已订航班出发前、且新航班出发24小时前办理）。
        原则上不能变更航空公司、乘客、区间、经停地和舱位，也不能在往返和单程之间互换。
        （官网列出的两个例外，提到不算错：①出票后若下位舱有空位，可以电话申请降舱，差额里程不退；
        ②已按上位舱里程出票的区间，在上位舱有空位时可以改回上位舱。两者都需电话办理。）
      must_mention: ["可以改日期/同区间航班", "原则上不能改舱位或区间（目的地）"]
      must_not_say: ["可以改目的地（区间）", "一般情况下可以自由更改舱位或升舱"]
    gold_urls: [*ana_refund]
    source_note: "変更・払い戻し > 変更；例外は 変更手続き の電話対応リスト（下位クラスへの変更）"
    revision_note: "2026-10-17: 公式に記載のある例外2件（下位クラスへの変更／上位クラスのマイルで発券済み区間の上位クラスへの変更）を許容。要人工確認"
    verified_at: null
    crosschecked_at: 2026-10-18
    verified_by: null

