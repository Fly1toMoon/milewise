[project]
name = "milewise"
version = "0.1.0"
description = "Award-ticket (mileage) assistant for ANA Mileage Club and JAL Mileage Bank, on AWS with the OpenAI API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "openai>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "httpx>=0.28",
    "numpy>=2.5.4",
    "langchain-aws>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[dynamodb,s3,cloudwatch,secretsmanager]>=1.40",
    "botocore[crt]>=1.40",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
milewise = "milewise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milewise"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Japanese / Chinese text legitimately uses full-width punctuation. Line length is
# enforced by `ruff format`; what remains over 100 is CJK string literals (width 2).
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["milewise"]
mypy_path = "src"
