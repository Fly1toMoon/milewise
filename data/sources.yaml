# Official pages Milewise reads (design.md §5). Committed; page contents are not.
#   fetch: http   -> scripts/fetch_sources.py fetches it (robots.txt checked, 5 s apart, honest UA)
#   fetch: manual -> saved by a person from a normal browser; imported with
#                    scripts/import_raw_bundle.py from data/raw/<bundle>/ (gitignored)
#   kind: rules -> chunked into RAG | chart -> parsed into data/charts | chart_later -> v1.1
# URLs are the final URLs after redirects, as recorded by the browser on 2026-10-17.

user_agent: "milewise/0.1 (+https://github.com/Fly1toMoon/milewise)"

sources:
