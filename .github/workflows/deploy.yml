# Eval-gated release on main (design.md M5, §4.6):
#   build the rules index from the raw pages in S3 -> build the arm64 image (code + index)
#   -> `candidate` alias -> eval against the candidate URL -> promote to `live` only if the
#   eval passes. A failing eval leaves users on the old code AND the old data.
# After uploading new raw pages (make upload-raw), run this workflow by hand (workflow_dispatch).
# AWS access is through GitHub OIDC (role created in infra/bootstrap; no stored keys).
# When the app stack has been destroyed (`make down`), the job skips instead of failing.
# Pushes that only touch Markdown or docs/ do not release (nothing in the image changes).
# A push whose changes since the live commit cannot affect answers (page, bot check, infra,
# tests; `release.sh needs-eval` has the list) releases without the eval. A manual run
# always evals.
# The release eval is a smoke test, not the full set: SMOKE_CASES (two cases, about $0.05)
# show the candidate answers, looks up charts and rules, cites them and handles a
# follow-up. The full 44 cases run with `make eval` locally, or here by hand with full_eval.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      full_eval:
        description: "Run all eval cases instead of the smoke cases (about $1)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SMOKE_CASES: both-01 multi-01
  AWS_REGION: ap-northeast-1

jobs:
  release:
    runs-on: ubuntu-24.04-arm # native arm64 build for the arm64 Lambda functions
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needs-eval diffs against the commit live serves
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Is the app stack up?
        id: stack
        run: |
          if scripts/release.sh 'up?'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::app stack is down (make down); nothing to deploy"
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the rules index
        if: steps.stack.outputs.up == 'true'
        run: scripts/release.sh index

      - name: Build and deploy to the candidate alias
        if: steps.stack.outputs.up == 'true'
        run: scripts/release.sh candidate "${GITHUB_SHA::7}"

      - name: Does this change need the eval?
        id: gate
        if: steps.stack.outputs.up == 'true'
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "eval=$(scripts/release.sh needs-eval)" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate the candidate
        if: steps.stack.outputs.up == 'true' && steps.gate.outputs.eval == 'true'
        run: |
          eval "$(scripts/release.sh eval-env)"
          only=()
          trigger=ci-deploy
          if [ "${{ inputs.full_eval }}" != true ]; then
            for c in $SMOKE_CASES; do only+=(--only "$c"); done
            trigger=ci-deploy-smoke
          fi
          uv run milewise eval "${only[@]}" \
            --target "$(scripts/release.sh candidate-url)" \
            --token-secret-arn milewise/app-token \
            --trigger "$trigger" --workers 2 --upload "$EVAL_UPLOAD"

      - name: Eval report
        if: always() && steps.stack.outputs.up == 'true'
        run: |
          if [ "${{ steps.gate.outputs.eval }}" = false ]; then
            echo "Eval skipped: nothing that affects answers changed since the live commit." >> "$GITHUB_STEP_SUMMARY"
          else
            cat eval/results/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Promote to live
        if: steps.stack.outputs.up == 'true'
        run: scripts/release.sh promote

      - uses: actions/upload-artifact@v7
        if: always() && steps.stack.outputs.up == 'true' && steps.gate.outputs.eval != 'false'
        with:
          name: eval-results
          path: eval/results/
