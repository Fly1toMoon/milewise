services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: milewise
      POSTGRES_PASSWORD: milewise   # local only
      POSTGRES_DB: milewise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milewise -d milewise"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
