<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milewise</title>
<meta name="description" content="ANA / JAL award ticket assistant: miles computed from the official charts, rules answered with citations.">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B26" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24 Q16 2 28 24' fill='none' stroke='%23B0186E' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='4' cy='24' r='3.5' fill='%2314263A'/%3E%3Ccircle cx='28' cy='24' r='3.5' fill='%2314263A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Aeronautical-chart palette: chart paper, ink, contour, airway magenta, terrain. */
  :root {
    --paper:#EEF2F0; --paper-2:#E3E9E6; --ink:#14263A; --contour:#5F7180; --rule:#C5D0D3;
    --magenta:#B0186E; --magenta-soft:rgba(176,24,110,.10); --terrain:#D9E4D2; --terrain-ink:#2F4A2C;
    --warn-bg:#F6E7C8; --warn-ink:#6A4A00; --field:#F8FAF9;
    --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    --num: "Barlow Semi Condensed", "Noto Sans JP", system-ui, sans-serif;
    color-scheme: light;
  }
  :root[lang="zh-CN"] { --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  :root[lang="en"] { --font: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#0F1B26; --paper-2:#152534; --ink:#DCE6EA; --contour:#8FA3B0; --rule:#26394A;
      --magenta:#E05AA6; --magenta-soft:rgba(224,90,166,.14); --terrain:#1C3020; --terrain-ink:#BFD8B6;
      --warn-bg:#3A2E12; --warn-ink:#F1D08A; --field:#132231; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:#0F1B26; --paper-2:#152534; --ink:#DCE6EA; --contour:#8FA3B0; --rule:#26394A;
    --magenta:#E05AA6; --magenta-soft:rgba(224,90,166,.14); --terrain:#1C3020; --terrain-ink:#BFD8B6;
    --warn-bg:#3A2E12; --warn-ink:#F1D08A; --field:#132231; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.75 var(--font); font-feature-settings:"palt" 0; }
  button, input, textarea { font:inherit; color:inherit; }
  a { color:var(--magenta); text-underline-offset:2px; }
  :focus-visible { outline:2px solid var(--magenta); outline-offset:2px; border-radius:3px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- shell ---------- */
  .shell { display:grid; grid-template-columns: 1fr; min-height:100dvh; }
  @media (min-width: 960px) { .shell { grid-template-columns: 264px 1fr; } }

  .history { display:none; border-right:1px solid var(--rule); background:var(--paper-2); padding:20px 12px; position:sticky; top:0; height:100dvh; overflow:auto; }
  @media (min-width: 960px) { .history { display:block; } }
  .history.open { display:block; position:fixed; inset:0 auto 0 0; width:min(86vw, 320px); z-index:30; box-shadow: 8px 0 32px rgba(10,20,30,.25); }
  .scrim { display:none; position:fixed; inset:0; background:rgba(10,20,30,.35); z-index:25; }
  .scrim.open { display:block; }
  .history h2 { font-size:14px; font-weight:500; color:var(--contour); margin:4px 8px 12px; }
  .history ol { list-style:none; margin:0; padding:0; }
  .history li { display:flex; align-items:flex-start; gap:2px; border-radius:6px; }
  .history li.current { background:var(--magenta-soft); }
  .history .open-h { flex:1; min-width:0; text-align:left; border:0; background:none; padding:8px; cursor:pointer; font-size:14px; line-height:1.5; border-radius:6px; }
  .history .open-h span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .history .open-h:hover { background:var(--magenta-soft); }
  .history .del { border:0; background:none; color:var(--contour); cursor:pointer; padding:8px 6px; font-size:16px; line-height:1; border-radius:6px; }
  .history .del:hover { color:var(--magenta); }
  .history .empty { color:var(--contour); font-size:13px; margin:0 8px; }
  .history .clear { margin:16px 8px 0; border:0; background:none; color:var(--contour); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; }

  .main { display:flex; flex-direction:column; min-width:0; }
  .col { width:100%; max-width:760px; margin:0 auto; padding:0 16px; }

  /* ---------- header ---------- */
  header.top { display:flex; align-items:center; gap:10px; padding-top:14px; padding-bottom:6px; }
  .wordmark { font-family:var(--num); font-weight:600; font-size:22px; letter-spacing:.01em; margin:0; margin-right:auto; }
  .icon-btn { border:1px solid var(--rule); background:transparent; border-radius:8px; width:36px; height:36px; display:inline-grid; place-items:center; cursor:pointer; color:var(--ink); }
  .icon-btn:hover { border-color:var(--contour); }
  .menu-btn { display:inline-grid; }
  @media (min-width: 960px) { .menu-btn { display:none; } }
  .langs { display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  .langs button { border:0; background:transparent; padding:0 11px; height:34px; cursor:pointer; font-size:14px; color:var(--contour); }
  .langs button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

  /* ---------- the arc: the one bold element ---------- */
  .arc { display:block; width:100%; height:auto; margin:6px 0 2px; overflow:visible; }
  .arc .graticule { stroke:var(--rule); stroke-width:1; fill:none; }
  .arc .route { stroke:var(--magenta); stroke-width:2.5; fill:none; stroke-linecap:round; }
  .arc .route.idle { stroke-dasharray:2 9; }
  .arc .pin { fill:var(--paper); stroke:var(--ink); stroke-width:2.5; }
  .arc .code { font-family:var(--num); font-weight:600; font-size:30px; fill:var(--ink); letter-spacing:.04em; }
  .arc .plane { fill:var(--magenta); }
  .lede { margin:0 0 4px; color:var(--contour); font-size:15px; max-width:38em; }

  /* ---------- conversation ---------- */
  .thread { flex:1; padding-top:8px; padding-bottom:24px; }
  .question { font-size:19px; font-weight:500; line-height:1.55; margin:18px 0 10px; overflow-wrap:anywhere; }
  .progress { display:flex; align-items:center; gap:10px; color:var(--contour); font-size:14px; min-height:24px; }
  .progress .dot { width:8px; height:8px; border-radius:50%; background:var(--magenta); animation: blink 1.2s ease-in-out infinite; }
  .progress .elapsed { font-family:var(--num); font-variant-numeric:tabular-nums; }
  @keyframes blink { 50% { opacity:.25; } }

  .answer { overflow-wrap:anywhere; }
  .answer p { margin:0 0 .8em; }
  .answer h3 { font-size:16px; font-weight:700; margin:1.3em 0 .4em; }
  .answer ul, .answer ol { margin:0 0 .9em; padding-left:1.3em; }
  .answer li { margin:.15em 0; }
  .answer blockquote { margin:0 0 .9em; padding:2px 0 2px 14px; border-left:3px solid var(--rule); color:var(--contour); }
  .answer blockquote p { margin:0 0 .4em; }
  .answer blockquote ul { margin:0 0 .4em; }
  .answer code { font-size:.9em; background:var(--paper-2); padding:1px 5px; border-radius:4px; }
  .answer strong { font-weight:700; }
  .answer .num { font-family:var(--num); font-weight:600; font-size:1.18em; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .answer .tbl { overflow-x:auto; margin:0 0 1em; }
  .answer table { border-collapse:collapse; font-size:15px; min-width:100%; }
  .answer th, .answer td { text-align:left; padding:6px 12px 6px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  .answer th { font-weight:500; color:var(--contour); }
  .answer.streaming > :last-child::after { content:""; display:inline-block; width:.5em; height:1em; margin-left:2px; vertical-align:-2px; background:var(--magenta); animation: blink 1s steps(1) infinite; }
  sup.cite { line-height:0; }
  sup.cite a { font-family:var(--num); font-weight:600; font-size:12px; text-decoration:none; padding:0 2px; color:var(--magenta); }
  sup.cite a:hover { text-decoration:underline; }

  .warning { background:var(--warn-bg); color:var(--warn-ink); border-radius:6px; padding:10px 14px; font-size:14px; margin:4px 0 16px; }
  .notice { color:var(--contour); font-size:15px; }

  /* sources: a chart legend on terrain tint */
  .sources { background:var(--terrain); color:var(--terrain-ink); border-radius:10px; padding:14px 16px 6px; margin:18px 0 8px; }
  .sources h2 { font-size:14px; font-weight:700; margin:0 0 8px; color:inherit; }
  .sources ol { list-style:none; margin:0; padding:0; }
  .sources li { display:grid; grid-template-columns:28px 1fr; gap:4px; padding:8px 0; border-top:1px solid color-mix(in srgb, var(--terrain-ink) 18%, transparent); scroll-margin-top:24px; transition: background-color .6s; border-radius:4px; }
  .sources li:first-child { border-top:0; }
  .sources li.flash { background:color-mix(in srgb, var(--magenta) 16%, transparent); }
  .sources .n { font-family:var(--num); font-weight:600; font-size:16px; color:var(--magenta); line-height:1.6; }
  .sources .what { font-size:14px; line-height:1.55; }
  .sources .what a { color:inherit; font-weight:500; }
  .sources .facts { display:block; font-size:13px; opacity:.85; }
  .sources li.uncited .n { color:inherit; opacity:.6; }

  .meta { color:var(--contour); font-size:13px; margin:6px 0 0; }

  /* welcome: examples */
  .examples { display:grid; gap:8px; margin:22px 0 8px; }
  @media (min-width: 640px) { .examples { grid-template-columns:1fr 1fr; } }
  .examples button { text-align:left; border:1px solid var(--rule); background:var(--field); border-radius:8px; padding:12px 14px; cursor:pointer; line-height:1.5; font-size:15px; }
  .examples button:hover { border-color:var(--magenta); }
  .examples .kind { display:block; color:var(--contour); font-size:12px; margin-bottom:2px; }

  /* ---------- composer ---------- */
  .composer-wrap { position:sticky; bottom:0; background:linear-gradient(to bottom, transparent, var(--paper) 18px); padding-top:18px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); z-index:10; }
  .composer { display:flex; align-items:flex-end; gap:8px; border:1.5px solid var(--rule); background:var(--field); border-radius:12px; padding:6px 6px 6px 14px; }
  .composer:focus-within { border-color:var(--ink); }
  .composer textarea { flex:1; border:0; background:transparent; resize:none; font-size:16px; line-height:1.6; padding:7px 0; max-height:40vh; min-height:28px; outline:none; overflow-y:auto; }
  .composer textarea:placeholder-shown { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .send { border:0; background:var(--magenta); color:#fff; border-radius:9px; height:40px; min-width:40px; padding:0 16px; cursor:pointer; font-weight:500; white-space:nowrap; }
  .send:disabled { opacity:.45; cursor:default; }
  .under { display:flex; justify-content:space-between; gap:12px; color:var(--contour); font-size:12px; margin:6px 2px 0; }
  @media (pointer: coarse) { .under .hint { visibility:hidden; } }
  .under .count { font-family:var(--num); font-variant-numeric:tabular-nums; }
  .under .count.over { color:var(--magenta); }

  footer.foot { color:var(--contour); font-size:12.5px; padding-bottom:28px; }
  footer.foot p { margin:0 0 8px; }
  footer.foot details summary { cursor:pointer; }
  footer.foot input { width:100%; max-width:360px; padding:6px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--field); margin-top:6px; }
  #turnstile { margin:8px 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="history" id="history" aria-labelledby="history-title">
    <h2 id="history-title" data-i18n="history"></h2>
    <ol id="history-list"></ol>
    <p class="empty" id="history-empty" data-i18n="historyEmpty"></p>
    <button class="clear" id="history-clear" type="button" data-i18n="historyClear" hidden></button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="col">
      <header class="top">
        <button class="icon-btn menu-btn" id="menu" type="button" aria-controls="history" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="sr" data-i18n="history"></span>
        </button>
        <h1 class="wordmark"><a href="/" id="home" style="color:inherit;text-decoration:none">Milewise</a></h1>
        <div class="langs" role="group" aria-label="Language" id="langs">
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="ja">日</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="theme" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 11.2A6 6 0 0 1 6.8 3.5a6 6 0 1 0 7.7 7.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span class="sr" data-i18n="theme"></span>
        </button>
      </header>

      <svg class="arc" id="arc" viewBox="0 0 720 150" role="img" aria-labelledby="arc-label">
        <title id="arc-label"></title>
        <path class="graticule" d="M0 128 H720 M0 88 Q360 70 720 88 M0 48 Q360 26 720 48" />
        <path class="graticule" d="M120 0 Q132 75 120 150 M360 0 V150 M600 0 Q588 75 600 150" />
        <path class="route idle" id="route" d="" />
        <circle class="pin" id="pin-a" r="7" />
        <circle class="pin" id="pin-b" r="7" />
        <text class="code" id="code-a" text-anchor="start"></text>
        <text class="code" id="code-b" text-anchor="end"></text>
      </svg>
    </div>

    <div class="col thread" id="thread" aria-live="polite">
      <div id="welcome">
        <p class="lede" data-i18n="lede"></p>
        <div class="examples" id="examples"></div>
      </div>
      <div id="turn" hidden>
        <p class="question" id="question"></p>
        <div class="progress" id="progress" hidden><span class="dot"></span><span id="stage"></span><span class="elapsed" id="elapsed"></span></div>
        <div class="answer" id="answer"></div>
        <div id="warning"></div>
        <section class="sources" id="sources" hidden aria-labelledby="sources-title">
          <h2 id="sources-title" data-i18n="sources"></h2>
          <ol id="sources-list"></ol>
        </section>
        <p class="meta" id="meta"></p>
      </div>
    </div>

    <div class="col composer-wrap">
      <form class="composer" id="form">
        <label class="sr" for="q" data-i18n="ask"></label>
        <textarea id="q" rows="1" maxlength="500" enterkeyhint="send" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" data-i18n="send"></button>
      </form>
      <div class="under"><span class="hint" data-i18n="enterHint"></span><span class="count" id="count">0 / 500</span></div>
      <div id="turnstile"></div>
    </div>

    <footer class="col foot">
      <p data-i18n="limits"></p>
      <p data-i18n="disclaimer"></p>
      <details>
        <summary data-i18n="ownerTitle"></summary>
        <p data-i18n="ownerBody"></p>
        <label class="sr" for="token">Owner token</label>
        <input id="token" type="password" autocomplete="off">
      </details>
    </footer>
  </div>
</div>

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ---------- arc ---------- */
function drawArc(a, b, idle) {
  const x1 = 40, x2 = 680, y = 106, h = 88;
  const d = `M${x1} ${y} Q360 ${y - h * 2} ${x2} ${y}`;
  const route = $("route");
  route.setAttribute("d", d);
  route.classList.toggle("idle", !!idle);
  for (const [pin, x] of [["pin-a", x1], ["pin-b", x2]]) { $(pin).setAttribute("cx", x); $(pin).setAttribute("cy", y); }
  $("code-a").setAttribute("x", x1 - 6); $("code-b").setAttribute("x", x2 + 6);
  for (const id of ["code-a", "code-b"]) $(id).setAttribute("y", 146);
  $("code-a").textContent = a; $("code-b").textContent = b;
  $("arc-label").textContent = `${a} → ${b}`;
  if (arcAnim) { arcAnim.cancel(); arcAnim = null; }
  route.style.strokeDasharray = "";
  if (!idle && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const len = route.getTotalLength();
    route.style.strokeDasharray = `${len}`;
    arcAnim = route.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
      { duration: 1100, easing: "cubic-bezier(.45,.05,.25,1)", fill: "forwards" });
  }
}
let arcAnim = null;
function guessRoute(text) {
  const found = [];
  for (const [code, re] of PLACES) {
    const m = text.match(re); if (m) found.push([m.index, code]);
  }
  found.sort((x, y) => x[0] - y[0]);
  const codes = [...new Set(found.map((f) => f[1]))];
  if (codes.length >= 2) return [codes[0], codes[1]];
  if (codes.length === 1) return codes[0] === "TYO" ? null : ["TYO", codes[0]];
  return null;
}
function routeFromEvidence(detail) {
  for (const v of Object.values(detail || {})) {
    if (v.kind === "chart" && v.route && v.route[0] && v.route[1]) return v.route.map((c) => String(c).slice(0, 4).toUpperCase());
  }
  return null;
}

/* ---------- markdown (small, safe subset) ---------- */
const SOURCES_HEAD = /^\s*(?:#{1,4}\s*|\*\*)?\s*(?:sources?|references?|出典|出所|情報源|引用元|参考(?:资料|資料|链接)?|来源(?:引用)?|資料)\s*(?:\*\*)?\s*[:：]?\s*(?:\*\*)?\s*$/i;
const WARN_LINE = /^\s*⚠️?\s*/;

function splitAnswer(text) {
  // The page shows sources and the post-check warning in their own places.
  const lines = text.split("\n");
  let warn = "";
  const w = lines.findIndex((l) => WARN_LINE.test(l) && /自動チェック|自动检查|Automatic check/.test(l));
  if (w >= 0) { warn = lines.splice(w).join("\n"); }
  const s = lines.findIndex((l) => SOURCES_HEAD.test(l));
  if (s > 0) lines.splice(s);
  return { body: lines.join("\n").trim(), warn };
}

function inline(s, cites) {
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[A-Za-z0-9\-._~:\/?#@!$&*+=%]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(\d{1,3}(?:[,，]\d{3})+|\d{4,})(\s?)(マイル|里程|英里|miles?)/gi, '<span class="num">$1</span>$2$3')
    .replace(/\[([CD]\d+)\]/g, (_, id) => {
      if (!cites.has(id)) cites.set(id, cites.size + 1);
      const n = cites.get(id);
      return `<sup class="cite"><a href="#src-${id}" data-cite="${id}" aria-label="${n}">${n}</a></sup>`;
    });
}

function render(md, cites) {
  const lines = esc(md).split("\n");
  let html = "", list = null, table = [];
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|"));
    const cell = (c) => /^[\s,、，CD\d]+$/.test(c) && /[CD]\d/.test(c) ? c.replace(/([CD]\d+)/g, "[$1]") : c;
    const [head, ...body] = rows.map((r) => r.map(cell));
    html += '<div class="tbl"><table><thead><tr>' + head.map((c) => `<th>${inline(c.trim(), cites)}</th>`).join("") + "</tr></thead><tbody>"
      + body.map((r) => "<tr>" + r.map((c) => `<td>${inline(c.trim(), cites)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>";
    table = [];
  };
  let quote = [];
  const flushQuote = () => {
    if (!quote.length) return;
    const inner = render(quote.join("\n").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&"), cites);
    html += `<blockquote>${inner}</blockquote>`; quote = [];
  };
  for (const raw of lines) {
    const bq = raw.match(/^\s*&gt;\s?(.*)$/);
    if (bq) { flushTable(); flushList(); quote.push(bq[1]); continue; }
    flushQuote();
    if (/^\s*\|.*\|\s*$/.test(raw)) { flushList(); table.push(raw); continue; }
    flushTable();
    const ul = raw.match(/^\s*[-*•]\s+(.*)$/), ol = raw.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (list !== tag) { flushList(); html += `<${tag}>`; list = tag; }
      html += `<li>${inline((ul || ol)[1], cites)}</li>`; continue;
    }
    flushList();
    const h = raw.match(/^#{1,4}\s+(.*)$/);
    if (h) html += `<h3>${inline(h[1], cites)}</h3>`;
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(raw)) continue;
    else if (raw.trim()) html += `<p>${inline(raw, cites)}</p>`;
  }
  flushQuote(); flushTable(); flushList();
  return html;
}

/* ---------- sources ---------- */
function sourceItem(id, n, card, url, cited) {
  const L = t();
  const li = document.createElement("li");
  li.id = `src-${id}`; if (!cited) li.className = "uncited";
  const c = card || { kind: id.startsWith("C") ? "chart" : "rule", url };
  const link = c.url || url;
  let name, facts = [];
  if (c.kind === "rule") {
    name = c.title || L.rule;
    if (c.section) facts.push(c.section);
  } else {
    name = c.kind === "season" ? L.season : L.chart;
    const what = [];
    if (c.route && c.route[0] && c.route[1]) what.push(`${c.route[0]} → ${c.route[1]}`);
    if (c.cabin) what.push(L.cabins[c.cabin] || c.cabin);
    if (c.trip_type) what.push(L.trips[c.trip_type] || c.trip_type);
    if (what.length) name += `：${what.join("，")}`;
    if (c.booking_from) facts.push(fmt(L.bookFrom, { d: c.booking_from }));
  }
  if (c.fetched) facts.push(fmt(L.fetched, { d: c.fetched }));
  const host = link ? new URL(link).host.replace(/^www\./, "") : "";
  li.innerHTML = `<span class="n">${cited ? n : "·"}</span><span class="what">`
    + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(name)}</a>` : esc(name))
    + `<span class="facts">${esc([host, ...facts].filter(Boolean).join("　"))}</span></span>`;
  return li;
}
function renderSources(done, cites) {
  const ev = (done && done.evidence) || {};
  const detail = (done && done.evidence_detail) || {};
  const ids = Object.keys(ev);
  const list = $("sources-list");
  list.replaceChildren();
  const cited = [...cites.keys()].filter((id) => ids.includes(id) || detail[id]);
  for (const id of cited) list.append(sourceItem(id, cites.get(id), detail[id], ev[id], true));
  for (const id of ids.filter((i) => !cites.has(i))) list.append(sourceItem(id, 0, detail[id], ev[id], false));
  $("sources").hidden = !list.children.length;
}
$("answer").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-cite]"); if (!a) return;
  const li = $(`src-${a.dataset.cite}`); if (!li) return;
  e.preventDefault();
  li.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1400);
});

/* ---------- one turn on screen ---------- */
let view = null;  // { q, text, done, streaming, stage, error, notice }
function renderTurn(v) {
  const L = t();
  $("welcome").hidden = true; $("turn").hidden = false;
  $("question").textContent = v.q;
  const { body, warn } = splitAnswer(v.text || "");
  const cites = new Map();
  $("answer").innerHTML = body ? render(body, cites) : "";
  $("answer").classList.toggle("streaming", !!v.streaming && !!body);
  const showWarn = v.done && (v.done.postcheck_ok === false || warn);
  $("warning").innerHTML = showWarn ? `<div class="warning" role="note">⚠ ${esc(L.warnPost)}</div>` : "";
  if (v.notice) $("answer").innerHTML = `<p class="notice">${esc(v.notice)}</p>`;
  if (v.done) renderSources(v.done, cites); else $("sources").hidden = true;
  const p = $("progress");
  p.hidden = !v.streaming;
  if (v.streaming) $("stage").textContent = L.stage[v.stage] || L.stage.working;
  const d = v.done;
  $("meta").textContent = d ? [
    d.cached ? L.cached : (d.latency_ms ? `${(d.latency_ms / 1000).toFixed(1)} s` : ""),
    d.model ? d.model.replace(/^bedrock:|^openai:/, "") : "",
  ].filter(Boolean).join("　") : "";
}
function showWelcome() {

/* ---------- history (this browser only) ---------- */
let current = null;
function loadHistory() { try { return JSON.parse(store.get("milewise-history", "[]")) || []; } catch { return []; } }
function saveHistory(h) { store.set("milewise-history", JSON.stringify(h.slice(0, HISTORY_MAX))); }

      const r = routeFromEvidence(item.done && item.done.evidence_detail) || guessRoute(item.q); if (r) drawArc(r[0], r[1]); closeDrawer(); renderHistory(); };
    const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", L.del);
    del.onclick = () => { saveHistory(loadHistory().filter((x) => x.id !== item.id)); if (current === item.id) showWelcome(); else renderHistory(); };

/* ---------- composer ---------- */
const q = $("q");
function autosize() {
  q.style.height = "auto";
  if (q.value) q.style.height = Math.min(q.scrollHeight, innerHeight * 0.4) + "px";
  const n = [...q.value].length;

}
q.addEventListener("input", autosize);
q.addEventListener("keydown", (e) => {
  // Enter sends; Shift+Enter and IME composition (Chinese/Japanese input) do not.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); }
});

// Cloudflare Turnstile, only when the server has a site key configured.
let turnstileWidget = null;
fetch("/config").then((r) => r.json()).then((cfg) => {
  if (!cfg.turnstile_site_key) return;
  window.onTurnstileLoad = () => {
    turnstileWidget = turnstile.render("#turnstile", { sitekey: cfg.turnstile_site_key, size: "flexible" });
  };
  const sc = document.createElement("script");
  sc.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit";
  sc.async = true; document.head.append(sc);
}).catch(() => {});

let busy = false, timer = null;
async function submit() {
  const L = t();
  const question = q.value.trim();
  if (busy || question.length < 2) return;
  if ([...question].length > MAX) { view = { q: question, notice: L.tooLong }; renderTurn(view); return; }
  busy = true; $("send").disabled = true; closeDrawer();
  current = null; renderHistory();
  view = { q: question, text: "", done: null, streaming: true, stage: "working" };
  renderTurn(view);
  const guess = guessRoute(question); if (guess) drawArc(guess[0], guess[1]); else drawArc("TYO", "LON", true);
  const t0 = performance.now();
  timer = setInterval(() => { $("elapsed").textContent = `${((performance.now() - t0) / 1000).toFixed(0)} s`; }, 500);
  $("elapsed").textContent = "";
  try {
    const headers = { "Content-Type": "application/json" };
    const token = $("token").value.trim();
    if (token) headers["Authorization"] = "Bearer " + token;
    if (window.turnstile && turnstileWidget !== null) {
      headers["X-Turnstile-Token"] = turnstile.getResponse(turnstileWidget) || "";
      turnstile.reset(turnstileWidget);  // one token per question
    }
    const res = await fetch("/ask", { method: "POST", headers, body: JSON.stringify({ question }) });
    if (!res.ok) {
      let code = ""; try { code = (await res.json()).code || ""; } catch {}
      view = { q: question, notice: L.denied[code] || fmt(L.httpError, { s: res.status }) }; renderTurn(view); return;
    }
    q.value = ""; autosize();
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", draft = "";
    let frame = 0;
    const paint = () => { frame = 0; if (view && view.q === question) renderTurn(view); };
    const schedule = () => { if (!frame) frame = requestAnimationFrame(paint); };
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1], data = (block.match(/^data: (.*)$/m) || [])[1];
        if (!ev || !data) continue;
        const d = JSON.parse(data);
        if (ev === "status") { view.stage = d.stage; }
        else if (ev === "progress") { draft = ""; view.text = ""; view.stage = d.name; }  // text before a tool call was a preamble
        else if (ev === "delta") { draft += d.text; view.text = draft; view.stage = "writing"; }
        else if (ev === "answer") { view.text = d.text; }
        else if (ev === "done") {
          view.done = d; view.streaming = false;
          const r = routeFromEvidence(d.evidence_detail);
          if (r && (!guess || r[0] !== guess[0] || r[1] !== guess[1])) drawArc(r[0], r[1]);
          const id = d.request_id || String(Date.now());
          saveHistory([{ id, q: question, text: view.text, done: d, ts: Date.now() }, ...loadHistory().filter((x) => x.q !== question)]);
          current = id; renderHistory();
        }
        else if (ev === "error") { view.streaming = false; view.notice = fmt(L.error, { id: d.request_id }); }
        schedule();
      }
    }
    if (view.streaming) { view.streaming = false; schedule(); }
  } catch (err) {
    view = { q: question, notice: fmt(t().network, { e: err.message || err }) }; renderTurn(view);
  } finally {
    clearInterval(timer); busy = false; $("send").disabled = false;
  }
}

applyLang();
showWelcome();
autosize();
</script>
</body>
</html>
