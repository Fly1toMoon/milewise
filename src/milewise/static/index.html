<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milewise</title>
<meta name="description" content="ANA / JAL award ticket assistant: miles computed from the official charts, rules answered with citations.">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B26" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 24 Q16 2 28 24' fill='none' stroke='%23B0186E' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='4' cy='24' r='3.5' fill='%2314263A'/%3E%3Ccircle cx='28' cy='24' r='3.5' fill='%2314263A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Aeronautical-chart palette: chart paper, ink, contour, airway magenta, terrain. */
  :root {
    --paper:#EEF2F0; --paper-2:#E3E9E6; --ink:#14263A; --contour:#5F7180; --rule:#C5D0D3;
    --magenta:#B0186E; --magenta-soft:rgba(176,24,110,.10); --terrain:#D9E4D2; --terrain-ink:#2F4A2C;
    --warn-bg:#F6E7C8; --warn-ink:#6A4A00; --field:#F8FAF9; --bubble:#DCE4E7;
    --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    --num: "Barlow Semi Condensed", "Noto Sans JP", system-ui, sans-serif;
    color-scheme: light;
  }
  :root[lang="zh-CN"] { --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  :root[lang="en"] { --font: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#0F1B26; --paper-2:#152534; --ink:#DCE6EA; --contour:#8FA3B0; --rule:#26394A;
      --magenta:#E05AA6; --magenta-soft:rgba(224,90,166,.14); --terrain:#1C3020; --terrain-ink:#BFD8B6;
      --warn-bg:#3A2E12; --warn-ink:#F1D08A; --field:#132231; --bubble:#1F3346; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:#0F1B26; --paper-2:#152534; --ink:#DCE6EA; --contour:#8FA3B0; --rule:#26394A;
    --magenta:#E05AA6; --magenta-soft:rgba(224,90,166,.14); --terrain:#1C3020; --terrain-ink:#BFD8B6;
    --warn-bg:#3A2E12; --warn-ink:#F1D08A; --field:#132231; --bubble:#1F3346; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.75 var(--font); }
  button, input, textarea { font:inherit; color:inherit; }
  a { color:var(--magenta); text-underline-offset:2px; }
  :focus-visible { outline:2px solid var(--magenta); outline-offset:2px; border-radius:3px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- shell ---------- */
  .shell { display:grid; grid-template-columns: 1fr; min-height:100dvh; }
  @media (min-width: 960px) { .shell { grid-template-columns: 264px 1fr; } }

  .side { display:none; border-right:1px solid var(--rule); background:var(--paper-2); padding:16px 12px; position:sticky; top:0; height:100dvh; overflow:auto; }
  @media (min-width: 960px) { .side { display:block; } }
  .side.open { display:block; position:fixed; inset:0 auto 0 0; width:min(86vw, 320px); z-index:30; box-shadow: 8px 0 32px rgba(10,20,30,.25); }
  .scrim { display:none; position:fixed; inset:0; background:rgba(10,20,30,.35); z-index:25; }
  .scrim.open { display:block; }
  .new-chat { display:flex; align-items:center; gap:8px; width:100%; border:1px solid var(--rule); background:var(--field); border-radius:9px; padding:9px 12px; cursor:pointer; font-size:14px; font-weight:500; }
  .new-chat:hover { border-color:var(--magenta); }
  .new-chat svg { color:var(--magenta); flex:none; }
  .side h2 { font-size:13px; font-weight:500; color:var(--contour); margin:20px 8px 8px; }
  .side ol { list-style:none; margin:0; padding:0; }
  .side li { display:flex; align-items:flex-start; gap:2px; border-radius:6px; }
  .side li.current { background:var(--magenta-soft); }
  .side .open-c { flex:1; min-width:0; text-align:left; border:0; background:none; padding:8px; cursor:pointer; font-size:14px; line-height:1.5; border-radius:6px; }
  .side .open-c span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .side .open-c small { display:block; color:var(--contour); font-size:12px; font-family:var(--num); }
  .side .open-c:hover { background:var(--magenta-soft); }
  .side .del { border:0; background:none; color:var(--contour); cursor:pointer; padding:8px 6px; font-size:16px; line-height:1; border-radius:6px; }
  .side .del:hover { color:var(--magenta); }
  .side .empty { color:var(--contour); font-size:13px; margin:0 8px; }
  .side .clear { margin:16px 8px 0; border:0; background:none; color:var(--contour); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; }

  .main { display:flex; flex-direction:column; min-width:0; min-height:100dvh; }
  .col { width:100%; max-width:780px; margin:0 auto; padding:0 16px; }

  /* ---------- header ---------- */
  header.top { position:sticky; top:0; z-index:12; background:var(--paper); }
  header.top .col { display:flex; align-items:center; gap:10px; padding-top:12px; padding-bottom:8px; }
  .wordmark { font-family:var(--num); font-weight:600; font-size:22px; letter-spacing:.01em; margin:0; margin-right:auto; }
  .wordmark a { color:inherit; text-decoration:none; }
  .icon-btn { border:1px solid var(--rule); background:transparent; border-radius:8px; width:36px; height:36px; display:inline-grid; place-items:center; cursor:pointer; color:var(--ink); flex:none; }
  .icon-btn:hover { border-color:var(--contour); }
  .narrow-only { display:inline-grid; }
  @media (min-width: 960px) { .narrow-only { display:none; } }
  .langs { display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; flex:none; }
  .langs button { border:0; background:transparent; padding:0 11px; height:34px; cursor:pointer; font-size:14px; color:var(--contour); }
  .langs button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

  /* ---------- welcome: the big arc is the one bold element ---------- */
  .welcome { padding-top:8px; }
  .arc { display:block; width:100%; height:auto; margin:4px 0 2px; overflow:visible; }
  .arc .graticule { stroke:var(--rule); stroke-width:1; fill:none; }
  .arc .route { stroke:var(--magenta); stroke-width:2.5; fill:none; stroke-linecap:round; stroke-dasharray:2 9; }
  .arc .pin { fill:var(--paper); stroke:var(--ink); stroke-width:2.5; }
  .arc .code { font-family:var(--num); font-weight:600; font-size:30px; fill:var(--ink); letter-spacing:.04em; }
  .lede { margin:4px 0 4px; color:var(--contour); font-size:15px; max-width:40em; }
  .examples { display:grid; gap:8px; margin:22px 0 8px; }
  @media (min-width: 640px) { .examples { grid-template-columns:1fr 1fr; } }
  .examples button { text-align:left; border:1px solid var(--rule); background:var(--field); border-radius:10px; padding:12px 14px; cursor:pointer; line-height:1.5; font-size:15px; }
  .examples button:hover { border-color:var(--magenta); }
  .examples .kind { display:block; color:var(--contour); font-size:12px; margin-bottom:2px; }

  /* ---------- conversation ---------- */
  .thread { flex:1; padding-top:8px; padding-bottom:16px; }
  .msg { margin:0 0 28px; }
  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .bubble { background:var(--bubble); border-radius:16px 16px 4px 16px; padding:9px 15px; max-width:min(82%, 560px); white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6; }
  .msg.bot { display:grid; grid-template-columns:28px 1fr; gap:12px; }
  .msg.bot .mark { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--field); border:1px solid var(--rule); margin-top:2px; }
  .msg.bot .body { min-width:0; }
  @media (max-width: 639px) { .msg.bot { grid-template-columns:1fr; } .msg.bot .mark { display:none; } }
  .route-line { display:flex; align-items:center; gap:8px; font-family:var(--num); font-weight:600; font-size:15px; letter-spacing:.04em; color:var(--ink); margin:2px 0 6px; }
  .route-line svg { flex:none; }
  .progress { display:flex; align-items:center; gap:10px; color:var(--contour); font-size:14px; min-height:28px; }
  .progress .dot { width:8px; height:8px; border-radius:50%; background:var(--magenta); animation: blink 1.2s ease-in-out infinite; }
  .progress .elapsed { font-family:var(--num); font-variant-numeric:tabular-nums; }
  @keyframes blink { 50% { opacity:.25; } }

  .answer { overflow-wrap:anywhere; }
  .answer p { margin:0 0 .8em; }
  .answer h3 { font-size:16px; font-weight:700; margin:1.3em 0 .4em; }
  .answer h3:first-child { margin-top:0; }
  .answer ul, .answer ol { margin:0 0 .9em; padding-left:1.3em; }
  .answer li { margin:.15em 0; }
  .answer blockquote { margin:0 0 .9em; padding:2px 0 2px 14px; border-left:3px solid var(--rule); color:var(--contour); }
  .answer blockquote p, .answer blockquote ul { margin:0 0 .4em; }
  .answer code { font-size:.9em; background:var(--paper-2); padding:1px 5px; border-radius:4px; }
  .answer strong { font-weight:700; }
  .answer .num { font-family:var(--num); font-weight:600; font-size:1.18em; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .answer .tbl { overflow-x:auto; margin:0 0 1em; }
  .answer table { border-collapse:collapse; font-size:15px; min-width:100%; }
  .answer th, .answer td { text-align:left; padding:6px 12px 6px 0; border-bottom:1px solid var(--rule); white-space:nowrap; }
  .answer th { font-weight:500; color:var(--contour); }
  .answer.streaming > :last-child::after { content:""; display:inline-block; width:.5em; height:1em; margin-left:2px; vertical-align:-2px; background:var(--magenta); animation: blink 1s steps(1) infinite; }
  sup.cite { line-height:0; }
  sup.cite a { font-family:var(--num); font-weight:600; font-size:12px; text-decoration:none; padding:0 2px; color:var(--magenta); }
  sup.cite a:hover { text-decoration:underline; }

  .warning { background:var(--warn-bg); color:var(--warn-ink); border-radius:6px; padding:10px 14px; font-size:14px; margin:4px 0 12px; }
  .notice { color:var(--contour); font-size:15px; margin:0; }

  /* sources: a chart legend on terrain tint */
  .sources { background:var(--terrain); color:var(--terrain-ink); border-radius:10px; padding:12px 16px 4px; margin:14px 0 6px; }
  .sources h4 { font-size:13px; font-weight:700; margin:0 0 6px; color:inherit; }
  .sources ol { list-style:none; margin:0; padding:0; }
  .sources li { display:grid; grid-template-columns:24px 1fr; gap:4px; padding:7px 0; border-top:1px solid color-mix(in srgb, var(--terrain-ink) 18%, transparent); scroll-margin-top:72px; transition: background-color .6s; border-radius:4px; }
  .sources li:first-child { border-top:0; }
  .sources li.flash { background:color-mix(in srgb, var(--magenta) 16%, transparent); }
  .sources .n { font-family:var(--num); font-weight:600; font-size:15px; color:var(--magenta); line-height:1.6; }
  .sources .what { font-size:14px; line-height:1.55; }
  .sources .what a { color:inherit; font-weight:500; }
  .sources .facts { display:block; font-size:13px; opacity:.85; }
  .sources li.uncited .n { color:inherit; opacity:.6; }
  .meta { color:var(--contour); font-size:12.5px; margin:4px 0 0; }

  /* ---------- composer ---------- */
  .composer-wrap { position:sticky; bottom:0; background:linear-gradient(to bottom, transparent, var(--paper) 18px); padding-top:18px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); z-index:10; }
  .composer { display:flex; align-items:flex-end; gap:8px; border:1.5px solid var(--rule); background:var(--field); border-radius:14px; padding:6px 6px 6px 14px; }
  .composer:focus-within { border-color:var(--ink); }
  .composer textarea { flex:1; border:0; background:transparent; resize:none; font-size:16px; line-height:1.6; padding:7px 0; max-height:40vh; min-height:28px; outline:none; overflow-y:auto; }
  .composer textarea:placeholder-shown { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .send { border:0; background:var(--magenta); color:#fff; border-radius:10px; height:40px; min-width:40px; padding:0 16px; cursor:pointer; font-weight:500; white-space:nowrap; }
  .send:disabled { opacity:.45; cursor:default; }
  .under { display:flex; justify-content:space-between; gap:12px; color:var(--contour); font-size:12px; margin:6px 2px 0; }
  @media (pointer: coarse) { .under .hint { visibility:hidden; } }
  .under .count { font-family:var(--num); font-variant-numeric:tabular-nums; }
  .under .count.over { color:var(--magenta); }
  #turnstile { margin:8px 0 0; }

  footer.foot { color:var(--contour); font-size:12.5px; padding-bottom:28px; }
  footer.foot p { margin:0 0 8px; }
  footer.foot details summary { cursor:pointer; }
  footer.foot input { width:100%; max-width:360px; padding:6px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--field); margin-top:6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Conversations">
    <button class="new-chat" id="new-chat" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i18n="newChat"></span>
    </button>
    <h2 data-i18n="conversations"></h2>
    <ol id="conv-list"></ol>
    <p class="empty" id="conv-empty" data-i18n="historyEmpty"></p>
    <button class="clear" id="conv-clear" type="button" data-i18n="historyClear" hidden></button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <div class="col">
        <button class="icon-btn narrow-only" id="menu" type="button" aria-controls="side" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="sr" data-i18n="conversations"></span>
        </button>
        <h1 class="wordmark"><a href="/" id="home">Milewise</a></h1>
        <button class="icon-btn narrow-only" id="new-chat-top" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="sr" data-i18n="newChat"></span>
        </button>
        <div class="langs" role="group" aria-label="Language" id="langs">
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="ja">日</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="theme" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M14.5 11.2A6 6 0 0 1 6.8 3.5a6 6 0 1 0 7.7 7.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span class="sr" data-i18n="theme"></span>
        </button>
      </div>
    </header>

    <div class="col welcome" id="welcome">
      <svg class="arc" id="arc" viewBox="0 0 720 150" role="img" aria-label="TYO → LON">
        <path class="graticule" d="M0 128 H720 M0 88 Q360 70 720 88 M0 48 Q360 26 720 48" />
        <path class="graticule" d="M120 0 Q132 75 120 150 M360 0 V150 M600 0 Q588 75 600 150" />
        <path class="route" id="route" d="M40 106 Q360 -70 680 106" />
        <circle class="pin" cx="40" cy="106" r="7" />
        <circle class="pin" cx="680" cy="106" r="7" />
        <text class="code" x="34" y="146" text-anchor="start">TYO</text>
        <text class="code" x="686" y="146" text-anchor="end">LON</text>
      </svg>
      <p class="lede" data-i18n="lede"></p>
      <div class="examples" id="examples"></div>
    </div>

    <div class="col thread" id="thread" aria-live="polite"></div>

    <div class="col composer-wrap">
      <form class="composer" id="form">
        <label class="sr" for="q" data-i18n="ask"></label>
        <textarea id="q" rows="1" maxlength="500" enterkeyhint="send" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" data-i18n="send"></button>
      </form>
      <div class="under"><span class="hint" data-i18n="enterHint"></span><span class="count" id="count">0 / 500</span></div>
      <div id="turnstile"></div>
    </div>

    <footer class="col foot" id="foot">
      <p data-i18n="limits"></p>
      <p data-i18n="disclaimer"></p>
      <details>
        <summary data-i18n="ownerTitle"></summary>
        <p data-i18n="ownerBody"></p>
        <label class="sr" for="token">Owner token</label>
        <input id="token" type="password" autocomplete="off">
      </details>
    </footer>
  </div>
</div>

<script>
"use strict";
const MAX = 500, CONV_MAX = 30, TURNS_MAX = 20, CONTEXT_TURNS = 3;

const I18N = {
  zh: {
    htmlLang: "zh-CN",
    lede: "ANA / JAL 里程兑换机票助手。所需里程按官方里程表用代码计算，规则问题引用官网原文回答，查不到依据时会直说不确定。可以接着追问。",
    ask: "你的问题", send: "发送", enterHint: "Enter 发送，Shift+Enter 换行",
    placeholder: "问里程或规则", followUp: "继续追问…",
    newChat: "新对话", conversations: "对话", historyEmpty: "对话会保存在这个浏览器里。", historyClear: "清空全部对话", del: "删除",
    theme: "切换深色/浅色", sources: "来源", turns: "{n} 问",
    stage: { working: "正在理解问题", get_required_miles: "正在查里程表", search_rules: "正在检索规则", get_season: "正在查季节日历", writing: "正在撰写回答" },
    kinds: { miles: "查里程", season: "季节 × 舱位", partner: "合作航空", rule: "规则" },
    chart: "里程表", season: "季节日历", rule: "规则页", bookFrom: "{d} 起预订适用", fetched: "抓取于 {d}",
    cabins: { Y: "经济舱", PY: "超级经济舱", C: "商务舱", F: "头等舱" }, trips: { OW: "单程", RT: "往返" },
    cached: "来自当日缓存", warnPost: "自动检查：回答里有依据数据之外的数字、引用或链接，请务必以官网为准。",
    limits: "免费演示：每个网络 10 分钟内 5 次、每天 20 次（追问也算一次）。全站当日额度用完后，日本时间 0 点恢复。不带上文的同一问题当天从缓存回答。",
    disclaimer: "非 ANA / JAL 官方服务。是否有空位、税费与燃油附加费请以官网为准。",

    denied: {

      public_budget: "今天的免费额度已用完，日本时间 0 点恢复。", owner_budget: "站长额度今天已用完。",
      public_off: "公开演示暂停中，请稍后再试。", bot_check: "人机验证未完成，请完成后再发送。",
    },
    examples: [
      ["miles", "东京到伦敦的商务舱往返，ANA 要多少里程？"],
      ["season", "7 月和 8 月从东京去台北，ANA 各舱位单程要多少里程？"],
      ["partner", "用 ANA 里程兑换合作航空的商务舱，从中国到欧洲要多少？"],
      ["rule", "JAL 国际线奖励机票退票要手续费吗？里程会退回吗？"],
    ],
  },
  ja: {
    htmlLang: "ja",
    lede: "ANA / JAL 特典航空券アシスタント。必要マイルは公式チャートからコードで計算し、規則は公式ページを引用して答えます。根拠がなければ「わからない」と答えます。続けて質問できます。",

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d = "") { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const fmt = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- language ---------- */
function initialLang() {
  const saved = store.get("milewise-lang");
  if (I18N[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || ""]) {
    if (/^zh/i.test(l)) return "zh";
    if (/^ja/i.test(l)) return "ja";
    if (/^en/i.test(l)) return "en";
  }
  return "ja";
}
let lang = initialLang();
const t = () => I18N[lang];

function applyLang() {
  const L = t();
  document.documentElement.lang = L.htmlLang;
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = L[el.dataset.i18n];
  for (const b of $("langs").children) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  $("examples").replaceChildren(...L.examples.map(([kind, text]) => {
    const b = document.createElement("button"); b.type = "button";

    b.onclick = () => { q.value = text; autosize(); submit(); };

}

/* ---------- conversations (this browser only) ---------- */
function loadConvs() {
  try {
    const v = JSON.parse(store.get("milewise-convs", "null"));
    if (Array.isArray(v)) return v;
  } catch {}
  // one-time move of the single-question history kept by the previous page
  let old = [];
  try { old = JSON.parse(store.get("milewise-history", "[]")) || []; } catch {}
  const convs = old.map((h) => ({ id: h.id, ts: h.ts || Date.now(), turns: [{ q: h.q, text: h.text, done: h.done }] }));
  saveConvs(convs); store.del("milewise-history");
  return convs;
}
function saveConvs(c) { store.set("milewise-convs", JSON.stringify(c.slice(0, CONV_MAX))); }
let convs = loadConvs();
let conv = null;  // the open conversation: { id, ts, turns: [{ q, text, done, notice?, streaming?, stage? }] }

function persist(c) {
  // only finished turns are stored; a conversation moves to the top when it gets a new answer
  const turns = c.turns.filter((x) => x.done).map(({ q, text, done }) => ({ q, text, done })).slice(-TURNS_MAX);
  if (!turns.length) return;
  convs = [{ id: c.id, ts: Date.now(), turns }, ...convs.filter((x) => x.id !== c.id)];
  saveConvs(convs);
}

function renderConvList() {
  const L = t();
  $("conv-empty").hidden = convs.length > 0; $("conv-clear").hidden = convs.length === 0;
  $("conv-list").replaceChildren(...convs.map((c) => {
    const li = document.createElement("li"); if (conv && c.id === conv.id) li.className = "current";
    const open = document.createElement("button"); open.type = "button"; open.className = "open-c";
    const title = document.createElement("span"); title.textContent = c.turns[0].q;
    const small = document.createElement("small"); small.textContent = c.turns.length > 1 ? fmt(L.turns, { n: c.turns.length }) : "";
    open.append(title, small);
    open.onclick = () => { if (busy) return; conv = structuredClone(c); closeDrawer(); renderAll(); scrollToEnd(false); };
    const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", L.del);
    del.onclick = () => {
      if (busy && conv && conv.id === c.id) return;
      convs = convs.filter((x) => x.id !== c.id); saveConvs(convs);
      if (conv && conv.id === c.id) conv = null;
      renderAll();

  }));
}

/* ---------- markdown (small, safe subset) ---------- */
// A sources section the model wrote anyway (the prompt asks it not to; older answers have one).
const SOURCES_HEAD = /^\s*(?:#{1,4}\s*|\*\*)?\s*(?:sources?|references?|evidence|出典(?:情報)?|出所|情報源|ソース(?:情報)?|引用元|参照(?:元)?|根拠(?:データ)?|参考(?:资料|資料|链接|來源)?|来源(?:引用|信息)?|資料|证据|依据)\s*(?:\*\*)?\s*[:：]?\s*(?:\*\*)?\s*$/i;

function splitAnswer(text) {
  // The page shows sources and the post-check warning in their own places.
  const lines = (text || "").split("\n");
  let warn = "";
  const w = lines.findIndex((l) => /^\s*⚠/.test(l) && /自動チェック|自动检查|Automatic check/.test(l));
  if (w >= 0) warn = lines.splice(w).join("\n");
  const s = lines.findIndex((l) => SOURCES_HEAD.test(l));
  if (s > 0) lines.splice(s);
  return { body: lines.join("\n").trim(), warn };
}

function inline(s, ctx) {
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(（])(https?:\/\/[A-Za-z0-9\-._~:\/?#@!$&*+=%]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(\d{1,3}(?:[,，]\d{3})+|\d{4,})(\s?)(マイル|里程|英里|miles?)/gi, '<span class="num">$1</span>$2$3')
    .replace(/\[([CD]\d+)\]/g, (_, id) => {
      if (!ctx.cites.has(id)) ctx.cites.set(id, ctx.cites.size + 1);
      const n = ctx.cites.get(id);
      return `<sup class="cite"><a href="#src-${ctx.turn}-${id}" data-cite="${ctx.turn}-${id}" aria-label="${n}">${n}</a></sup>`;
    });
}

function render(md, ctx) {
  const lines = esc(md).split("\n");
  let html = "", list = null, table = [], quote = [];
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const cell = (c) => /^[\s,、，CD\d]+$/.test(c) && /[CD]\d/.test(c) ? c.replace(/([CD]\d+)/g, "[$1]") : c;
    const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map(cell));
    const [head, ...body] = rows;
    html += '<div class="tbl"><table><thead><tr>' + head.map((c) => `<th>${inline(c.trim(), ctx)}</th>`).join("") + "</tr></thead><tbody>"
      + body.map((r) => "<tr>" + r.map((c) => `<td>${inline(c.trim(), ctx)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>";
    table = [];
  };
  const flushQuote = () => {
    if (!quote.length) return;
    const raw = quote.join("\n").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
    html += `<blockquote>${render(raw, ctx)}</blockquote>`; quote = [];
  };
  for (const line of lines) {
    const bq = line.match(/^\s*&gt;\s?(.*)$/);
    if (bq) { flushTable(); flushList(); quote.push(bq[1]); continue; }
    flushQuote();
    if (/^\s*\|.*\|\s*$/.test(line)) { flushList(); table.push(line); continue; }
    flushTable();
    const ul = line.match(/^\s*[-*•]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (list !== tag) { flushList(); html += `<${tag}>`; list = tag; }
      html += `<li>${inline((ul || ol)[1], ctx)}</li>`; continue;
    }
    flushList();
    const h = line.match(/^#{1,4}\s+(.*)$/);
    if (h) html += `<h3>${inline(h[1], ctx)}</h3>`;
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) continue;
    else if (line.trim()) html += `<p>${inline(line, ctx)}</p>`;
  }
  flushQuote(); flushTable(); flushList();
  return html;
}

/* ---------- one answer ---------- */
function routeOf(done) {
  for (const v of Object.values((done && done.evidence_detail) || {})) {
    if (v.kind === "chart" && v.route && v.route[0] && v.route[1]) return v.route.map((c) => String(c).slice(0, 4).toUpperCase());
  }
  return null;
}
function routeLine(r) {
  return `<div class="route-line" aria-label="${esc(r[0])} → ${esc(r[1])}"><span>${esc(r[0])}</span>`
    + `<svg width="56" height="16" viewBox="0 0 56 16" aria-hidden="true"><path d="M3 13 Q28 -6 53 13" fill="none" stroke="var(--magenta)" stroke-width="2" stroke-linecap="round"/>`
    + `<circle cx="3" cy="13" r="2.5" fill="var(--ink)"/><circle cx="53" cy="13" r="2.5" fill="var(--ink)"/></svg><span>${esc(r[1])}</span></div>`;
}
function sourceItem(key, id, n, card, url, cited) {
  const L = t();
  const c = card || { kind: id.startsWith("C") ? "chart" : "rule", url };
  const link = c.url || url;
  let name; const facts = [];
  if (c.kind === "rule") {
    name = c.title || L.rule;
    if (c.section) facts.push(c.section);
  } else {
    name = c.kind === "season" ? L.season : L.chart;
    const what = [];
    if (c.route && c.route[0] && c.route[1]) what.push(`${c.route[0]} → ${c.route[1]}`);
    if (c.cabin) what.push(L.cabins[c.cabin] || c.cabin);
    if (c.trip_type) what.push(L.trips[c.trip_type] || c.trip_type);
    if (what.length) name += `：${what.join("，")}`;
    if (c.booking_from) facts.push(fmt(L.bookFrom, { d: c.booking_from }));
  }
  if (c.fetched) facts.push(fmt(L.fetched, { d: c.fetched }));
  let host = "";
  try { host = link ? new URL(link).host.replace(/^www\./, "") : ""; } catch {}
  return `<li id="src-${key}"${cited ? "" : ' class="uncited"'}><span class="n">${cited ? n : "·"}</span><span class="what">`
    + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(name)}</a>` : esc(name))
    + `<span class="facts">${esc([host, ...facts].filter(Boolean).join("　"))}</span></span></li>`;
}
function sourcesHtml(turnKey, done, cites) {
  const ev = (done && done.evidence) || {}, detail = (done && done.evidence_detail) || {};
  const ids = Object.keys(ev);
  const items = [...cites.keys()].filter((id) => ids.includes(id) || detail[id])
    .map((id) => sourceItem(`${turnKey}-${id}`, id, cites.get(id), detail[id], ev[id], true))
    .concat(ids.filter((i) => !cites.has(i)).map((id) => sourceItem(`${turnKey}-${id}`, id, 0, detail[id], ev[id], false)));
  return items.length ? `<section class="sources"><h4>${esc(t().sources)}</h4><ol>${items.join("")}</ol></section>` : "";
}

const MARK = '<span class="mark" aria-hidden="true"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M2 10 Q8 -2 14 10" fill="none" stroke="var(--magenta)" stroke-width="2" stroke-linecap="round"/></svg></span>';

function botHtml(turn, i) {
  const L = t();
  if (turn.notice) return `<div class="msg bot">${MARK}<div class="body"><p class="notice">${esc(turn.notice)}</p></div></div>`;
  const { body, warn } = splitAnswer(turn.text);
  const ctx = { cites: new Map(), turn: i };
  let html = "";
  const r = routeOf(turn.done);
  if (r) html += routeLine(r);
  if (turn.streaming) {
    html += `<div class="progress"><span class="dot"></span><span>${esc(L.stage[turn.stage] || L.stage.working)}</span><span class="elapsed" data-elapsed></span></div>`;
  }
  if (body) html += `<div class="answer${turn.streaming ? " streaming" : ""}">${render(body, ctx)}</div>`;
  const d = turn.done;
  if (d && (d.postcheck_ok === false || warn)) html += `<div class="warning" role="note">⚠ ${esc(L.warnPost)}</div>`;
  if (d) {
    html += sourcesHtml(i, d, ctx.cites);
    const meta = [d.cached ? L.cached : (d.latency_ms ? `${(d.latency_ms / 1000).toFixed(1)} s` : ""), d.model ? d.model.replace(/^bedrock:|^openai:/, "") : ""].filter(Boolean).join("　");
    if (meta) html += `<p class="meta">${esc(meta)}</p>`;
  }
  return `<div class="msg bot" data-turn="${i}">${MARK}<div class="body">${html}</div></div>`;
}
function turnHtml(turn, i) {
  return `<div class="msg user"><div class="bubble">${esc(turn.q)}</div></div>` + botHtml(turn, i);
}

/* ---------- page ---------- */
function renderAll() {
  const inConv = !!(conv && conv.turns.length);
  $("welcome").hidden = inConv;
  $("thread").innerHTML = inConv ? conv.turns.map(turnHtml).join("") : "";
  q.placeholder = inConv ? t().followUp : t().placeholder;
  renderConvList();
}
function renderLast() {
  // re-render only the answer being streamed
  const i = conv.turns.length - 1;
  const el = $("thread").querySelector(`.msg.bot[data-turn="${i}"]`) || $("thread").lastElementChild;
  const stick = nearBottom();
  if (el) el.outerHTML = botHtml(conv.turns[i], i); else renderAll();
  tickElapsed();
  if (stick) scrollToEnd(false);
}
function nearBottom() { return innerHeight + scrollY >= document.documentElement.scrollHeight - 160; }
function scrollToEnd(smooth) { scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth && !reducedMotion() ? "smooth" : "auto" }); }

$("thread").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-cite]"); if (!a) return;
  const li = $(`src-${a.dataset.cite}`); if (!li) return;
  e.preventDefault();
  li.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "center" });
  li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1400);
});

}).catch(() => {});

let busy = false, started = 0;
function tickElapsed() {
  const el = document.querySelector("[data-elapsed]");
  if (el && started) el.textContent = `${Math.round((performance.now() - started) / 1000)} s`;
}
setInterval(tickElapsed, 500);

function contextOf(c) {
  // the last few finished turns, as the API's history (answers without the sources section)
  return c.turns.filter((x) => x.done && x.text).slice(-CONTEXT_TURNS).flatMap((x) => [
    { role: "user", content: x.q },
    { role: "assistant", content: splitAnswer(x.text).body },
  ]);
}

async function submit() {
  const L = t();
  const question = q.value.trim();
  if (busy || question.length < 2) return;
  if (!conv) conv = { id: (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()), ts: Date.now(), turns: [] };
  if ([...question].length > MAX) { conv.turns.push({ q: question, notice: L.tooLong }); renderAll(); scrollToEnd(true); return; }
  while (conv.turns.length && conv.turns[conv.turns.length - 1].notice) conv.turns.pop();
  const history = contextOf(conv);
  const turn = { q: question, text: "", done: null, streaming: true, stage: "working" };
  conv.turns.push(turn);
  busy = true; $("send").disabled = true; closeDrawer();
  q.value = ""; autosize();
  renderAll(); scrollToEnd(true);
  started = performance.now();
  const c = conv;
  const fail = (notice) => { turn.streaming = false; turn.notice = notice; if (conv === c) renderLast(); if (!q.value) { q.value = question; autosize(); } };
  try {
    const headers = { "Content-Type": "application/json" };
    const token = $("token").value.trim();
    if (token) headers["Authorization"] = "Bearer " + token;
    if (window.turnstile && turnstileWidget !== null) {
      headers["X-Turnstile-Token"] = turnstile.getResponse(turnstileWidget) || "";
      turnstile.reset(turnstileWidget);  // one token per question
    }
    const res = await fetch("/ask", { method: "POST", headers, body: JSON.stringify({ question, history }) });
    if (!res.ok) {
      let code = ""; try { code = (await res.json()).code || ""; } catch {}
      fail(L.denied[code] || fmt(L.httpError, { s: res.status })); return;
    }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    let frame = 0;
    const paint = () => { frame = 0; if (conv === c) renderLast(); };
    const schedule = () => { if (!frame) frame = requestAnimationFrame(paint); };
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1], data = (block.match(/^data: (.*)$/m) || [])[1];
        if (!ev || !data) continue;
        const d = JSON.parse(data);
        if (ev === "status") turn.stage = d.stage === "cached" ? "writing" : d.stage;
        else if (ev === "progress") { turn.text = ""; turn.stage = d.name; }  // text before a tool call was a preamble
        else if (ev === "delta") { turn.text += d.text; turn.stage = "writing"; }
        else if (ev === "answer") turn.text = d.text;
        else if (ev === "done") { turn.done = d; turn.streaming = false; persist(c); if (conv === c) renderConvList(); }
        else if (ev === "error") { fail(fmt(L.error, { id: d.request_id })); }
        schedule();
      }
    }
    if (turn.streaming) fail(fmt(L.error, { id: "stream" }));
  } catch (err) {
    fail(fmt(L.network, { e: err.message || err }));
  } finally {
    busy = false; $("send").disabled = false; started = 0;
  }
}

applyLang();
autosize();
</script>
</body>
</html>
